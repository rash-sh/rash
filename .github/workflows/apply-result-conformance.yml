name: Apply result compatibility and example conformance

on:
  push:
    branches:
      - feat/task-runtime-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/task-runtime-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt
      - name: Apply compatibility layer and conformance tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace('rash_core/src/task/mod.rs',
          '''        object.insert("changed".into(), serde_json::json!(changed));
                  object.insert("failed".into(), serde_json::json!(failed));
                  object.insert("output".into(), serde_json::json!(output));
                  object.insert("extra".into(), extra_json.clone());''',
          '''        object.insert("changed".into(), serde_json::json!(changed));
                  object.insert("failed".into(), serde_json::json!(failed));
                  object.insert("output".into(), serde_json::json!(output.clone()));
                  // Compatibility alias used by older Rash/Ansible-style scripts. `output` is the
                  // canonical generic field, while `stdout` is convenient for command results.
                  object.insert("stdout".into(), serde_json::json!(output));
                  object.insert("extra".into(), extra_json.clone());''')

          replace('rash_core/src/task/mod.rs',
          '''        assert_eq!(value.get_attr("rc").unwrap().as_i64(), Some(4));
                  assert_eq!(
                      value
                          .get_attr("extra")''',
          '''        assert_eq!(value.get_attr("rc").unwrap().as_i64(), Some(4));
                  assert_eq!(value.get_attr("stdout").unwrap().as_str(), Some("out"));
                  assert_eq!(
                      value
                          .get_attr("extra")''')

          replace('rash_core/src/jinja/mod.rs',
          '''const OMIT_VALUE: &str = "OMIT_THIS_VARIABLE";

          fn init_env() -> Environment<'static> {''',
          '''const OMIT_VALUE: &str = "OMIT_THIS_VARIABLE";

          fn result_flag(value: Value, key: &str) -> Option<bool> {
              value.get_attr(key).ok().map(|flag| flag.is_true())
          }

          fn result_failed(value: Value) -> bool {
              result_flag(value, "failed").unwrap_or(false)
          }

          fn result_succeeded(value: Value) -> bool {
              result_flag(value, "failed").is_some_and(|failed| !failed)
          }

          fn result_changed(value: Value) -> bool {
              result_flag(value, "changed").unwrap_or(false)
          }

          fn init_env() -> Environment<'static> {''')
          replace('rash_core/src/jinja/mod.rs',
          '''    env.add_global("omit", OMIT_VALUE);
              lookup::add_lookup_functions(&mut env);
              env
          }''',
          '''    env.add_global("omit", OMIT_VALUE);
              env.add_test("failed", result_failed);
              env.add_test("succeeded", result_succeeded);
              env.add_test("success", result_succeeded);
              env.add_test("changed", result_changed);
              lookup::add_lookup_functions(&mut env);
              env
          }''')
          replace('rash_core/src/jinja/mod.rs',
          '''    #[test]
              fn test_render_string_omit() {''',
          '''    #[test]
              fn test_result_state_tests() {
                  let failed = Value::from_serialize(serde_json::json!({"failed": true, "changed": false}));
                  let ok = Value::from_serialize(serde_json::json!({"failed": false, "changed": true}));
                  assert_eq!(
                      render_string("{% if value is failed %}failed{% endif %}", &context! {value => failed}).unwrap(),
                      "failed"
                  );
                  assert_eq!(
                      render_string("{% if value is succeeded %}ok{% endif %}", &context! {value => ok.clone()}).unwrap(),
                      "ok"
                  );
                  assert_eq!(
                      render_string("{% if value is changed %}changed{% endif %}", &context! {value => ok}).unwrap(),
                      "changed"
                  );
              }

              #[test]
              fn test_render_string_omit() {''')
          PY

          mkdir -p rash_core/tests
          cat > rash_core/tests/examples_parse.rs <<'RS'
          use std::fs;
          use std::path::Path;

          use rash_core::context::GlobalParams;
          use rash_core::task::{parse_file, parse_file_with_handlers};
          use walkdir::WalkDir;

          #[test]
          fn every_rash_example_has_a_valid_task_schema() {
              let examples = Path::new(env!("CARGO_MANIFEST_DIR")).join("../examples");
              let params = GlobalParams::default();
              let mut checked = 0usize;
              let mut failures = Vec::new();

              for entry in WalkDir::new(&examples).into_iter().filter_map(Result::ok) {
                  let path = entry.path();
                  if !entry.file_type().is_file()
                      || path.extension().and_then(|ext| ext.to_str()) != Some("rh")
                  {
                      continue;
                  }
                  checked += 1;
                  let content = match fs::read_to_string(path) {
                      Ok(content) => content,
                      Err(error) => {
                          failures.push(format!("{}: cannot read: {error}", path.display()));
                          continue;
                      }
                  };

                  if parse_file_with_handlers(&content, &params).is_ok()
                      || parse_file(&content, &params).is_ok()
                  {
                      continue;
                  }

                  let mapping_error = parse_file_with_handlers(&content, &params)
                      .unwrap_err()
                      .to_string();
                  let sequence_error = parse_file(&content, &params).unwrap_err().to_string();
                  failures.push(format!(
                      "{}:\n  mapping form: {mapping_error}\n  sequence form: {sequence_error}",
                      path.display()
                  ));
              }

              assert!(checked > 0, "no .rh examples found under {}", examples.display());
              assert!(
                  failures.is_empty(),
                  "{} of {checked} Rash examples do not parse:\n{}",
                  failures.len(),
                  failures.join("\n")
              );
          }
          RS

          cargo fmt --all
      - name: Commit implementation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-result-conformance.yml
          git add -A
          git commit -m "test(core): enforce result and example conformance"
          git push origin HEAD:feat/task-runtime-hardening
      - name: Run conformance gate
        run: |
          cargo check --workspace --all-targets
          cargo test -p rash_core --test examples_parse -- --nocapture
          cargo test -p rash_core

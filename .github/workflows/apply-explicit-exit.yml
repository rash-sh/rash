name: Apply explicit exit control flow

on:
  push:
    branches:
      - feat/task-runtime-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/task-runtime-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Dedicated exit representation and error kind.
          replace('rash_core/src/error.rs',
          '''enum Repr {
              Simple(ErrorKind),
              Custom(Box<Custom>),
          }''',
          '''enum Repr {
              Simple(ErrorKind),
              Custom(Box<Custom>),
              Exit(i32),
          }''')
          replace('rash_core/src/error.rs',
          '''    /// Program finish gracefully returning 0
              GracefulExit,
              /// An entity was not found, often a module.''',
          '''    /// Program finish gracefully returning 0
              GracefulExit,
              /// Program termination explicitly requested by the script.
              ExplicitExit,
              /// An entity was not found, often a module.''')
          replace('rash_core/src/error.rs',
          '''            ErrorKind::GracefulExit => "program finish gracefully",
                      ErrorKind::NotFound => "entity not found",''',
          '''            ErrorKind::GracefulExit => "program finish gracefully",
                      ErrorKind::ExplicitExit => "explicit program exit",
                      ErrorKind::NotFound => "entity not found",''')
          replace('rash_core/src/error.rs',
          '''impl Error {
              /// Creates a new `rash` error from a known kind of error as well as an''',
          '''impl Error {
              /// Request that the Rash process terminates with an explicit status code.
              pub fn explicit_exit(code: i32) -> Error {
                  Error { repr: Repr::Exit(code) }
              }

              /// Creates a new `rash` error from a known kind of error as well as an''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Custom(ref c) => c.kind,
                      Repr::Simple(kind) => kind,
                  }''',
          '''        match self.repr {
                      Repr::Custom(ref c) => c.kind,
                      Repr::Simple(kind) => kind,
                      Repr::Exit(_) => ErrorKind::ExplicitExit,
                  }''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Custom(..) => None,
                      Repr::Simple(..) => None,
                  }''',
          '''        match self.repr {
                      Repr::Exit(code) => Some(code),
                      Repr::Custom(..) | Repr::Simple(..) => None,
                  }''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Simple(..) => None,
                      Repr::Custom(ref c) => Some(&*c.error),
                  }''',
          '''        match self.repr {
                      Repr::Simple(..) | Repr::Exit(..) => None,
                      Repr::Custom(ref c) => Some(&*c.error),
                  }''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Simple(..) => None,
                      Repr::Custom(ref mut c) => Some(&mut *c.error),
                  }''',
          '''        match self.repr {
                      Repr::Simple(..) | Repr::Exit(..) => None,
                      Repr::Custom(ref mut c) => Some(&mut *c.error),
                  }''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Simple(..) => None,
                      Repr::Custom(c) => Some(c.error),
                  }''',
          '''        match self.repr {
                      Repr::Simple(..) | Repr::Exit(..) => None,
                      Repr::Custom(c) => Some(c.error),
                  }''')
          replace('rash_core/src/error.rs',
          '''        match *self {
                      Repr::Custom(ref c) => fmt::Debug::fmt(&c, fmt),
                      Repr::Simple(kind) => fmt.debug_tuple("Kind").field(&kind).finish(),
                  }''',
          '''        match *self {
                      Repr::Custom(ref c) => fmt::Debug::fmt(&c, fmt),
                      Repr::Simple(kind) => fmt.debug_tuple("Kind").field(&kind).finish(),
                      Repr::Exit(code) => fmt.debug_tuple("Exit").field(&code).finish(),
                  }''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Custom(ref c) => c.error.fmt(fmt),
                      Repr::Simple(kind) => write!(fmt, "{}", kind.as_str()),
                  }''',
          '''        match self.repr {
                      Repr::Custom(ref c) => c.error.fmt(fmt),
                      Repr::Simple(kind) => write!(fmt, "{}", kind.as_str()),
                      Repr::Exit(code) => write!(fmt, "exit requested with status {code}"),
                  }''')
          replace('rash_core/src/error.rs',
          '''        match self.repr {
                      Repr::Simple(..) => None,
                      Repr::Custom(ref c) => c.error.source(),
                  }''',
          '''        match self.repr {
                      Repr::Simple(..) | Repr::Exit(..) => None,
                      Repr::Custom(ref c) => c.error.source(),
                  }''')
          replace('rash_core/src/error.rs',
          '''    #[test]
              fn test_downcasting() {''',
          '''    #[test]
              fn test_explicit_exit_preserves_status() {
                  let error = Error::explicit_exit(23);
                  assert_eq!(error.kind(), ErrorKind::ExplicitExit);
                  assert_eq!(error.raw_os_error(), Some(23));
                  assert_eq!(error.to_string(), "exit requested with status 23");
              }

              #[test]
              fn test_downcasting() {''')

          # meta is the explicit control-flow primitive.
          replace('rash_core/src/modules/meta.rs',
          '''pub enum MetaAction {
              FlushHandlers,
          }''',
          '''pub enum MetaAction {
              FlushHandlers,
              Exit,
          }''')
          replace('rash_core/src/modules/meta.rs',
          '''struct Params {
              action: MetaAction,
          }''',
          '''struct Params {
              action: MetaAction,
              #[serde(default)]
              code: Option<u8>,
          }''')
          replace('rash_core/src/modules/meta.rs',
          '''                Ok((result, None))
                      }
                  }''',
          '''                Ok((result, None))
                      }
                      MetaAction::Exit => Err(Error::explicit_exit(params.code.unwrap_or(0) as i32)),
                  }''')
          replace('rash_core/src/modules/meta.rs',
          '''    #[test]
              fn test_meta_flush_handlers() {''',
          '''    #[test]
              fn test_meta_exit_preserves_requested_status() {
                  let meta = Meta;
                  let global_params = create_test_global_params();
                  let params: YamlValue = serde_norway::from_str("action: exit\\ncode: 42").unwrap();
                  let error = meta.exec(&global_params, params, &context! {}, false).unwrap_err();
                  assert_eq!(error.kind(), ErrorKind::ExplicitExit);
                  assert_eq!(error.raw_os_error(), Some(42));
              }

              #[test]
              fn test_meta_flush_handlers() {''')

          # Do not convert explicit exit into a semantic task failure.
          replace('rash_core/src/task/mod.rs',
          '''        match module_result {
                      Ok((result, result_vars)) => {
                          self.finalize_module_result(result, result_vars, &extended_vars)
                      }
                      Err(error) => Ok(self.module_error_result(error)),
                  }''',
          '''        match module_result {
                      Ok((result, result_vars)) => {
                          self.finalize_module_result(result, result_vars, &extended_vars)
                      }
                      Err(error) if error.kind() == ErrorKind::ExplicitExit => Err(error),
                      Err(error) => Ok(self.module_error_result(error)),
                  }''')
          replace('rash_core/src/task/mod.rs',
          '''        let initial_vars = vars;
                  let main = self.exec_main_task(initial_vars.clone());
                  let (main_result, main_hard_error) = match main {''',
          '''        let initial_vars = vars;
                  let main = match self.exec_main_task(initial_vars.clone()) {
                      Err(error) if error.kind() == ErrorKind::ExplicitExit => {
                          if let Some(always_tasks) = &self.always {
                              self.execute_task_sequence(always_tasks, initial_vars.clone())?;
                          }
                          return Err(error);
                      }
                      result => result,
                  };
                  let (main_result, main_hard_error) = match main {''')
          replace('rash_core/src/task/mod.rs',
          '''        let result = match execution {
                      Ok(result) => result,
                      Err(error) if self.ignore_errors.unwrap_or(false) => self.module_error_result(error),
                      Err(error) => return Err(error),
                  };''',
          '''        let result = match execution {
                      Ok(result) => result,
                      Err(error) if error.kind() == ErrorKind::ExplicitExit => return Err(error),
                      Err(error) if self.ignore_errors.unwrap_or(false) => self.module_error_result(error),
                      Err(error) => return Err(error),
                  };''')
          replace('rash_core/src/task/mod.rs',
          '''    #[test]
              fn invalid_task_attribute_is_rejected() {''',
          '''    #[test]
              fn explicit_exit_runs_always_but_not_rescue_and_ignores_ignore_errors() {
                  let yaml: YamlValue = serde_norway::from_str(
                      r#"
                      meta:
                        action: exit
                        code: 17
                      ignore_errors: true
                      rescue:
                        - fail:
                            msg: rescue must not run
                      always:
                        - debug:
                            msg: cleanup
                      "#,
                  )
                  .unwrap();
                  let global_params = GlobalParams::default();
                  let task = Task::new(&yaml, &global_params).unwrap();
                  let error = task.exec(context! {}).unwrap_err();
                  assert_eq!(error.kind(), ErrorKind::ExplicitExit);
                  assert_eq!(error.raw_os_error(), Some(17));
              }

              #[test]
              fn invalid_task_attribute_is_rejected() {''')

          # Explicit exit is a successful control-flow decision, not a logged crash.
          replace('rash_core/src/bin/rash.rs',
          '''fn crash_error(e: Error) -> ! {
              error!("{e}");
              let exit_code = e.raw_os_error().unwrap_or(1);''',
          '''fn crash_error(e: Error) -> ! {
              if e.kind() == ErrorKind::ExplicitExit {
                  exit(e.raw_os_error().unwrap_or(0));
              }
              error!("{e}");
              let exit_code = e.raw_os_error().unwrap_or(1);''')

          # Documentation anchors for meta.
          p = Path('rash_core/src/modules/meta.rs')
          text = p.read_text()
          text = text.replace('| action    | true     | string | flush_handlers  | The meta action to perform     |',
                              '| action    | true     | string | flush_handlers, exit | The meta action to perform  |')
          text = text.replace('|\n///\n/// ANCHOR_END: parameters',
                              '|\n/// | code      | false    | integer | 0-255 | Exit status when action is `exit` (default: 0) |\n///\n/// ANCHOR_END: parameters', 1)
          text = text.replace('///     action: flush_handlers\n/// ```',
                              '///     action: flush_handlers\n///\n/// - name: Exit with an application-specific status\n///   meta:\n///     action: exit\n///     code: 2\n/// ```')
          p.write_text(text)
          PY
          cargo fmt --all
      - name: Commit implementation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-explicit-exit.yml
          git add -A
          git commit -m "feat(core): add explicit script exit status"
          git push origin HEAD:feat/task-runtime-hardening
      - name: Compile and test core
        run: |
          cargo check --workspace --all-targets
          cargo test -p rash_core

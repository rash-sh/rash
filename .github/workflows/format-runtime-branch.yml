name: One-shot format runtime branch

on:
  push:
    branches:
      - feat/task-runtime-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/task-runtime-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-runtime-branch.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(core): apply rustfmt"
          git push origin HEAD:feat/task-runtime-hardening
